[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "owon-spe6103-controller"
version = "1.0.0"
description = "Independent cross-platform Python controller, monitor, and CLI for the OWON SPE6103 programmable DC power supply"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
owon-psu = "python_controller.cli:main"

[tool.setuptools.packages.find]
include = ["python_controller*"]
